<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conference Realignment Simulator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Design System -->
  <link rel="stylesheet" href="./design-system/theme.css" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       APP SHELL
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      font-family: var(--font-body);
    }

    /* Full-height app wrapper */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       HEADER
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    #app-header .bs-header {
      padding-bottom: 0;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    /* Action buttons (header) */
    .btn-action {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-action:hover {
      background: rgba(255,255,255,0.2);
    }
    .btn-action--primary {
      background: rgba(255,255,255,0.18);
    }

    /* Presets dropdown */
    .presets-wrap {
      position: relative;
    }
    .presets-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      z-index: 999;
      min-width: 240px;
      overflow: hidden;
    }
    .presets-dropdown.open { display: block; }

    .preset-item {
      display: flex;
      flex-direction: column;
      width: 100%;
      background: none;
      border: none;
      padding: 10px 14px;
      text-align: left;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .preset-item:last-child { border-bottom: none; }
    .preset-item:hover { background: var(--surface); }
    .preset-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .preset-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       AD PLACEHOLDERS
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .ad-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.15);
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: var(--radius-sm);
      color: rgba(255,255,255,0.35);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 8px 0;
    }
    .ad-leaderboard {
      width: 100%;
      max-width: 728px;
      height: 50px;         /* collapsed for aesthetics; real impl would be 90px */
      margin: 6px auto;
    }
    .ad-sidebar {
      width: 100%;
      height: 200px;
      margin-top: auto;
      background: var(--surface-2);
      border: 1px dashed var(--border-mid);
      color: var(--text-muted);
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       BODY LAYOUT (sidebar + main)
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    #app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left analytics sidebar */
    #analytics-sidebar {
      width: 280px;
      flex-shrink: 0;
      overflow-y: auto;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    /* Main content area */
    #main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      background: var(--surface);
    }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       ANALYTICS PANEL
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .analytics-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 100%);
    }
    .analytics-header .bs-display-sm {
      color: #fff;
    }

    .analytics-section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .analytics-section-title {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .balance-row, .travel-row, .market-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      padding: 3px 0;
    }
    .balance-conf, .travel-conf, .market-conf {
      font-weight: 700;
      font-size: 11px;
      font-family: var(--font-display);
      letter-spacing: 0.04em;
    }
    .balance-count, .travel-val {
      font-size: 11px;
      color: var(--text-mid);
    }
    .market-val {
      font-size: 10px;
      color: var(--text-mid);
      text-align: right;
      max-width: 140px;
    }
    .balance-warn {
      background: var(--warn-bg);
      border-radius: 4px;
      padding: 3px 6px;
      margin: 1px -6px;
    }

    #analytics-sidebar .bs-analytics-grid {
      padding: 10px 12px;
    }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       CONFERENCE BOARD (drag-drop)
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .conf-board {
      display: flex;
      gap: 12px;
      padding: 16px;
      min-height: 100%;
      align-items: flex-start;
      min-width: max-content;
    }

    .conf-column {
      width: 200px;
      flex-shrink: 0;
      background: var(--bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .conf-col-header {
      padding: 10px 12px 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .conf-col-title {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .conf-col-name {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conf-col-badge {
      background: var(--accent-light);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .btn-delete-col {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 0 0 0 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-delete-col:hover { color: var(--wrong); }

    .conf-col-body {
      padding: 8px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background 0.15s;
      flex: 1;
    }
    .conf-col-body.drag-over {
      background: var(--accent-light);
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
      border-radius: var(--radius-sm);
    }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       TEAM CARDS
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .team-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 8px;
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.1s, opacity 0.1s;
    }
    .team-card:hover {
      box-shadow: var(--shadow-sm);
      border-color: var(--border-mid);
    }
    .team-card.dragging {
      opacity: 0.45;
      cursor: grabbing;
    }

    .team-card-swatch {
      width: 4px;
      height: 32px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .team-card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .team-card-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team-card-meta {
      font-size: 10px;
      color: var(--text-muted);
    }
    .team-card-short {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    /* Add conference column button */
    .conf-column--add {
      border: 2px dashed var(--border-mid);
      background: transparent;
      min-height: 80px;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .btn-add-conf {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 20px 16px;
      width: 100%;
      height: 100%;
      transition: color 0.15s;
    }
    .btn-add-conf:hover { color: var(--accent); }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       MAP TAB
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    #leaflet-map {
      z-index: 1;
    }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       TOAST
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .bs-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(17,17,34,0.92);
      color: #fff;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
    }
    .bs-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       RESPONSIVE
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    @media (max-width: 700px) {
      #analytics-sidebar {
        display: none;
      }
      .conf-board {
        flex-direction: column;
        min-width: unset;
      }
      .conf-column {
        width: 100%;
      }
    }
  </style>
</head>
<body class="app-realignment">

<div id="app">

  <!-- â”€â”€ HEADER â”€â”€ -->
  <div id="app-header"></div>

  <!-- â”€â”€ BODY (sidebar + main) â”€â”€ -->
  <div id="app-body">

    <!-- Left Analytics Sidebar -->
    <aside id="analytics-sidebar">
      <div id="analytics-panel">
        <!-- Populated by renderAnalyticsPanel() -->
        <div style="padding:24px;color:var(--text-muted);font-size:12px;">Loadingâ€¦</div>
      </div>
    </aside>

    <!-- Main content (tab-controlled) -->
    <main id="main-content">
      <!-- Populated by renderMain() -->
    </main>

  </div>

</div><!-- #app -->

<!-- â”€â”€ CDN SCRIPTS â”€â”€ -->

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- D3 v7 as UMD global (sets window.d3) -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- App modules (ES module) -->
<script type="module" src="./app.js"></script>

</body>
</html>
