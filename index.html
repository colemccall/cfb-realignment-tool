<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Conference Realignment Simulator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Design System -->
  <link rel="stylesheet" href="./design-system/theme.css" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ── APP SHELL ── */
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      font-family: var(--font-body);
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── FOCUS STYLES (accessibility) ── */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* ── HEADER ── */
    #app-header .bs-header { padding-bottom: 0; }
    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .btn-action {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      touch-action: manipulation; /* prevent double-tap zoom on iOS */
    }
    .btn-action:hover { background: rgba(255,255,255,0.22); }
    .btn-action--primary { background: rgba(255,255,255,0.18); }

    /* ── DROPDOWNS (Presets + Scenarios) ── */
    .presets-wrap, .scenarios-wrap {
      position: relative;
    }
    .presets-dropdown, .scenarios-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      z-index: 1000;
      min-width: 240px;
      overflow: hidden;
    }
    .presets-dropdown.open, .scenarios-dropdown.open { display: block; }
    .preset-item, .scenario-item {
      display: flex;
      flex-direction: column;
      width: 100%;
      background: none;
      border: none;
      padding: 10px 14px;
      text-align: left;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .preset-item:last-child, .scenario-item:last-child { border-bottom: none; }
    .preset-item:hover, .scenario-item:hover { background: var(--surface); }
    .preset-name, .scenario-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .preset-desc, .scenario-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .scenario-item {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .scenario-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .btn-scenario-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      flex-shrink: 0;
      transition: color 0.1s;
    }
    .btn-scenario-delete:hover { color: var(--wrong); }
    .scenarios-empty {
      padding: 14px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
    .scenarios-save-row {
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .btn-save-scenario {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-save-scenario:hover { opacity: 0.88; }

    /* ── TIMELINE SCRUBBER ── */
    .timeline-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0 0;
      width: 100%;
    }
    .timeline-label {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      letter-spacing: 0.04em;
      min-width: 140px;
    }
    .timeline-label span {
      color: #fff;
      font-size: 13px;
    }
    .timeline-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .timeline-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .timeline-ticks {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0;
      margin-top: -2px;
    }
    .timeline-tick {
      font-size: 9px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0;
      font-weight: 600;
      text-align: center;
    }
    .timeline-tick.active { color: rgba(255,255,255,0.9); }

    /* ── AD PLACEHOLDERS ── */
    .ad-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.15);
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: var(--radius-sm);
      color: rgba(255,255,255,0.35);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 8px 0;
    }
    .ad-leaderboard {
      width: 100%;
      max-width: 728px;
      height: 50px;
      margin: 6px auto;
    }
    .ad-sidebar {
      width: 100%;
      height: 200px;
      margin-top: auto;
      background: var(--surface-2);
      border: 1px dashed var(--border-mid);
      color: var(--text-muted);
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }

    /* ── BODY LAYOUT ── */
    #app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #analytics-sidebar {
      width: 288px;
      flex-shrink: 0;
      overflow-y: auto;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    #main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      background: var(--surface);
      position: relative;
    }

    /* ── ANALYTICS PANEL ── */
    .analytics-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 100%);
    }
    .analytics-header .bs-display-sm { color: #fff; }
    .analytics-section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .analytics-section-title {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .balance-row, .travel-row, .market-row, .strength-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      padding: 4px 0;
    }
    .balance-conf, .travel-conf, .market-conf, .strength-conf {
      font-weight: 700;
      font-size: 11px;
      font-family: var(--font-display);
      letter-spacing: 0.04em;
    }
    .balance-count, .travel-val {
      font-size: 11px;
      color: var(--text-mid);
      font-weight: 500;
    }
    .market-val {
      font-size: 10px;
      color: var(--text-mid);
      text-align: right;
      max-width: 140px;
    }
    .balance-warn {
      background: var(--warn-bg);
      border-radius: 4px;
      padding: 3px 6px;
      margin: 1px -6px;
    }
    #analytics-sidebar .bs-analytics-grid { padding: 10px 12px; }

    /* Strength score bars */
    .strength-bar-wrap {
      flex: 1;
      height: 6px;
      background: var(--surface-2);
      border-radius: 3px;
      margin: 0 8px;
      overflow: hidden;
    }
    .strength-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .strength-score {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-mid);
      min-width: 24px;
      text-align: right;
    }

    /* ── CONFERENCE BOARD ── */
    .conf-board {
      display: flex;
      gap: 12px;
      padding: 16px;
      min-height: 100%;
      align-items: flex-start;
      min-width: max-content;
    }
    .conf-column {
      width: 204px;
      flex-shrink: 0;
      background: var(--bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* FCS column special styling */
    .conf-column--fcs {
      border-style: dashed;
      border-color: var(--border-mid);
      opacity: 0.88;
    }
    .conf-column--fcs .conf-col-header {
      background: var(--surface-2);
    }
    .conf-column--fcs .conf-col-name {
      font-style: italic;
      color: var(--text-muted);
    }

    .conf-col-header {
      padding: 10px 12px 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .conf-col-title {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .conf-col-name {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conf-col-badge {
      background: var(--accent-light);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .conf-col-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .btn-rename-col, .btn-delete-col {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      border-radius: 3px;
      transition: color 0.1s, background 0.1s;
    }
    .btn-rename-col:hover { color: var(--accent); background: var(--accent-light); }
    .btn-delete-col:hover { color: var(--wrong); }

    .conf-col-body {
      padding: 8px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: background 0.15s;
      flex: 1;
    }
    .conf-col-body.drag-over {
      background: var(--accent-light);
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
      border-radius: var(--radius-sm);
    }

    /* ── TEAM CARDS ── */
    .team-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 9px;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: box-shadow 0.1s, opacity 0.1s, border-color 0.1s;
    }
    .team-card:hover {
      box-shadow: var(--shadow-sm);
      border-color: var(--border-mid);
    }
    .team-card.dragging { opacity: 0.45; cursor: grabbing; }
    .team-logo-wrap {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .team-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 3px;
    }
    .team-card-swatch {
      width: 4px;
      height: 28px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .team-card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .team-card-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .team-card-meta {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.3;
      margin-top: 1px;
    }
    .team-card-short {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    /* FCS badge on team cards */
    .team-fcs-badge {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #fff;
      background: #888;
      border-radius: 3px;
      padding: 1px 4px;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    /* Add conference column button */
    .conf-column--add {
      border: 2px dashed var(--border-mid);
      background: transparent;
      min-height: 80px;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .btn-add-conf {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 20px 16px;
      width: 100%;
      height: 100%;
      transition: color 0.15s;
    }
    .btn-add-conf:hover { color: var(--accent); }

    /* ── MAP TAB ── */
    #leaflet-map {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
    }

    /* ── SCHOOL CARD PANEL (map click) ── */
    #school-card-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 280px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      z-index: 600;
      overflow: hidden;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s cubic-bezier(0.34,1.4,0.64,1), opacity 0.18s ease;
    }
    #school-card-panel.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: all;
    }
    .sc-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
    }
    .sc-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .sc-logo-swatch {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .sc-title { flex: 1; min-width: 0; }
    .sc-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1.1;
    }
    .sc-conf-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      margin-top: 4px;
      color: #fff;
      letter-spacing: 0.03em;
    }
    .btn-sc-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 2px;
      align-self: flex-start;
      border-radius: 3px;
      transition: color 0.1s;
    }
    .btn-sc-close:hover { color: var(--text); }
    .sc-body { padding: 10px 14px; }
    .sc-stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 3px 0;
      border-bottom: 1px solid var(--border);
    }
    .sc-stat-row:last-child { border-bottom: none; }
    .sc-stat-label { color: var(--text-muted); font-weight: 500; }
    .sc-stat-value { color: var(--text); font-weight: 600; }
    /* ── COMMISSIONER SCORE BANNER ── */
    .commissioner-score-banner {
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cs-number {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }
    .cs-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }
    .cs-grade {
      font-family: var(--font-display);
      font-size: 52px;
      font-weight: 800;
      color: rgba(255,255,255,0.85);
      line-height: 1;
    }

    .sc-colors {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .sc-color-chip {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.12);
    }

    /* ── TOAST ── */
    .bs-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(13,13,26,0.94);
      color: #fff;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
    }
    .bs-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      /* ── Shell ── */
      #app { height: 100dvh; overflow: hidden; }
      #app-body { flex-direction: column; overflow: hidden; }
      #main-content { overflow: auto; -webkit-overflow-scrolling: touch; }

      /* ── Header: collapse tagline, tighten buttons ── */
      .bs-logo-sub { display: none; }
      .bs-logo { font-size: 18px !important; }
      .bs-header-top { flex-wrap: wrap; gap: 4px; padding: 8px 12px 6px; }
      .header-actions { flex-wrap: wrap; gap: 4px; }
      .btn-action { padding: 6px 10px; font-size: 12px; }
      .ad-leaderboard { display: none; }

      /* ── Timeline: keep but shrink ── */
      .timeline-wrap { padding: 4px 12px 6px; }
      .timeline-slider { height: 20px; }
      .timeline-label { font-size: 11px; }

      /* ── Conference board: full-width stacked columns ── */
      .conf-board { flex-direction: column; min-width: unset; padding: 8px; gap: 8px; }
      .conf-column { width: 100%; }
      /* Touch-friendly card sizing */
      .team-card { padding: 9px 10px; min-height: 44px; touch-action: none; }
      .team-logo { width: 24px; height: 24px; }
      .team-logo-wrap { width: 24px; height: 24px; }

      /* ── Map tab ── */
      #leaflet-map { position: static !important; height: 55dvh !important; }
      #school-card-panel { left: 8px; right: 8px; bottom: 8px; width: auto; }

      /* ── Analytics: slide-up panel instead of sidebar ── */
      #analytics-sidebar {
        display: block;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: auto;
        max-height: 55dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: var(--bg);
        border-top: 2px solid var(--border-mid);
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -4px 24px rgba(0,0,0,0.18);
        z-index: 800;
        transform: translateY(100%);
        transition: transform 0.3s ease;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      #analytics-sidebar.mobile-open {
        transform: translateY(0);
      }
      /* Pull handle */
      #analytics-sidebar::before {
        content: '';
        display: block;
        width: 36px; height: 4px;
        background: var(--border-mid);
        border-radius: 2px;
        margin: 10px auto 4px;
      }
      /* Floating analytics toggle button */
      #btn-analytics-toggle {
        display: flex;
      }

      /* Dropdowns open upward on mobile */
      .presets-dropdown, .scenarios-dropdown {
        bottom: calc(100% + 4px);
        top: auto;
      }
    }

    /* Analytics toggle button — hidden on desktop */
    #btn-analytics-toggle { display: none; }
  </style>
</head>
<body class="app-realignment">

<div id="app">

  <!-- â”€â”€ HEADER â”€â”€ -->
  <div id="app-header"></div>

  <!-- â”€â”€ BODY (sidebar + main) â”€â”€ -->
  <div id="app-body">

    <!-- Left Analytics Sidebar -->
    <aside id="analytics-sidebar">
      <div id="analytics-panel">
        <!-- Populated by renderAnalyticsPanel() -->
